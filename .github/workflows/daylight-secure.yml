name: Daylight secure release candidate
on:
  pull_request:
    paths:
      - 'glass-calendar/secure-app/**'
      - 'mcp/**'
      - 'supabase/**'
      - '.github/workflows/daylight-secure.yml'
  push:
    branches:
      - feature/daylight-secure-release-20261102
    paths:
      - 'glass-calendar/secure-app/**'
      - 'mcp/**'
      - 'supabase/**'
      - '.github/workflows/daylight-secure.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glass-calendar/secure-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend
        run: npm install --no-audit --no-fund
      - name: Compile secure client
        run: npm run build
      - name: Upload compiled app
        uses: actions/upload-artifact@v4
        with:
          name: daylight-secure-client
          path: glass-calendar/secure-app/dist
          retention-days: 7
  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install MCP dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check MCP
        run: npm run check
