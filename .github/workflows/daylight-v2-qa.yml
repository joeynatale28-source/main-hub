name: Daylight v2 staging QA
on:
  push:
    branches: ['feature/daylight-v2-supabase']
    paths:
      - 'glass-calendar/**'
      - 'mcp/**'
      - '.github/workflows/daylight-v2-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend
        working-directory: glass-calendar
        run: npm install --no-audit --no-fund
      - name: Check frontend and build
        working-directory: glass-calendar
        run: npm run check && npm test && npm run build
      - name: Install and typecheck MCP
        working-directory: mcp
        run: npm install --no-audit --no-fund && npm run build
