name: Daylight v2 staging QA
on:
  push:
    branches: ['feature/daylight-v2-supabase']
    paths:
      - 'glass-calendar/**'
      - '.github/workflows/daylight-v2-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daylight-v2-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  staging-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glass-calendar
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build Vite application
        env:
          VITE_SUPABASE_URL: https://qrqemjgpzoqhtmsowmqv.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_MuX0ICyo0pYrhrj3wu5G0g_v6_gy8Pj
        run: npm run build
      - name: Run browser tests against staging source
        run: npm test
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daylight-v2-qa-results
          path: |
            glass-calendar/test-results/
            glass-calendar/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
