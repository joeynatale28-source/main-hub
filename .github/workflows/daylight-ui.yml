name: Daylight UI regression tests
on:
  push:
    branches: [main]
    paths:
      - 'glass-calendar/**'
      - '.github/workflows/daylight-ui.yml'
  pull_request:
    paths:
      - 'glass-calendar/**'
      - '.github/workflows/daylight-ui.yml'
permissions:
  contents: read
jobs:
  frontend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and validate
        working-directory: glass-calendar
        run: npm install --no-audit --no-fund && npm run check && npm test && npm run build
