name: Daylight GitHub Pages release verification
on:
  push:
    branches: [main]
    paths:
      - 'glass-calendar/**'
      - '.github/workflows/daylight-ui.yml'
  pull_request:
    paths:
      - 'glass-calendar/**'
      - '.github/workflows/daylight-ui.yml'
permissions:
  contents: read
concurrency:
  group: daylight-pages-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secure-ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: glass-calendar/secure-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build authenticated Daylight
        run: npm run build
      - name: Test login, Settings, event creation and Tasks
        run: npm test
      - name: Verify GitHub Pages files are self-hosted and configured
        working-directory: .
        run: |
          test -s glass-calendar/site-config.js
          test -s glass-calendar/secure-app/src/main.js
          test -s glass-calendar/secure-app/src/style.css
          grep -q 'secure-app/src/main.js' glass-calendar/index.html
          grep -q 'site-config.js' glass-calendar/index.html
          grep -q '__DAYLIGHT_CONFIG' glass-calendar/secure-app/src/main.js
  deployed-page:
    if: github.event_name == 'push'
    needs: secure-ui
    runs-on: ubuntu-latest
    steps:
      - name: Verify new app is available on GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          url="https://joeynatale28-source.github.io/main-hub/glass-calendar/"
          for attempt in $(seq 1 40); do
            if curl --location --fail --silent --max-time 12 "$url?check=${{ github.sha }}" > /tmp/daylight-pages.html &&
               grep -q 'secure-app/src/main.js' /tmp/daylight-pages.html &&
               curl --location --fail --silent --max-time 12 "${url}secure-app/src/main.js" | grep -q '__DAYLIGHT_CONFIG'; then
              echo "New authenticated Daylight is served by GitHub Pages"
              exit 0
            fi
            echo "Waiting for Pages release ($attempt/40)"
            sleep 6
          done
          echo "GitHub Pages has not served the new homepage"
          exit 1

  visual-regression:
    name: Screenshots — Midnight and Daylight at desktop/laptop sizes
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: glass-calendar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install visual-test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Render and assert both themes at 1920px and 1366px
        run: CI= npx playwright test tests/perfection.spec.js --reporter=line --workers=1
      - name: Preserve screenshot captures and trace on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daylight-ui-screenshots
          path: |
            glass-calendar/test-results/**/*.png
            glass-calendar/test-results/**/*.zip
          if-no-files-found: ignore
          retention-days: 7
