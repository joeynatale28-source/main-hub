name: Daylight current-build account and OAuth verification
on:
  push:
    branches: [main]
    paths:
      - 'glass-calendar/**'
      - '.github/workflows/daylight-ui.yml'
  pull_request:
    paths:
      - 'glass-calendar/**'
      - '.github/workflows/daylight-ui.yml'
permissions:
  contents: read
concurrency:
  group: daylight-current-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  auth-ui:
    name: Existing calendar with supplied Supabase auth design
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: glass-calendar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Static logic integrity (preserve the user-authored calendar styles)
        run: |
          test -s index.html
          test -s style.css
          test -s auth-screen.css
          test -s js/store.js
          test -s js/app.js
          test -s js/auth-boot.js
          test -s js/ai-access-logic.js
          test -s oauth/consent/index.html
          grep -q 'style.css' index.html
          grep -q 'auth-boot.js' index.html
          node --check js/app.js
          node --check js/store.js
          node --check js/ai-access-logic.js
          node --check js/auth-boot.js
      - name: Browser tests for login, signup, password reset and OAuth callback
        run: npx playwright test tests/daylight-auth.spec.js --reporter=line --workers=1
      - name: Preserve failure screenshots/traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daylight-auth-current-build
          path: |
            glass-calendar/test-results/**/*.png
            glass-calendar/test-results/**/*.zip
          retention-days: 7
          if-no-files-found: ignore
  deployed:
    name: GitHub Pages serves the current user-authored build
    if: github.event_name == 'push'
    needs: auth-ui
    runs-on: ubuntu-latest
    steps:
      - name: Verify updated authentication entry point
        run: |
          set -euo pipefail
          url="https://joeynatale28-source.github.io/main-hub/glass-calendar/"
          for n in $(seq 1 30); do
            if curl -LfsS --max-time 15 "$url?build=${{ github.sha }}" -o /tmp/daylight.html &&
               grep -q 'js/auth-boot.js' /tmp/daylight.html &&
               curl -LfsS --max-time 15 "${url}js/auth-boot.js" | grep -q 'daylight_save_snapshot'; then
              echo 'Current Daylight account build deployed'
              exit 0
            fi
            sleep 6
          done
          echo 'GitHub Pages has not deployed this commit yet'
          exit 1
