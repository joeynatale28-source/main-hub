name: Daylight UI regression tests
on:
  push:
    branches: [main]
    paths:
      - 'glass-calendar/**'
      - '.github/workflows/daylight-ui.yml'
  pull_request:
    paths:
      - 'glass-calendar/**'
      - '.github/workflows/daylight-ui.yml'
permissions:
  contents: read
jobs:
  responsive-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glass-calendar
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check script syntax
        run: npm run check
      - name: Run browser regression tests
        run: npm test
      - name: Upload failed-test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daylight-ui-test-results
          path: |
            glass-calendar/test-results/
            glass-calendar/playwright-report/
          retention-days: 7
