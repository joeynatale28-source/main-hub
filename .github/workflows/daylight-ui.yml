name: Daylight reference-HTML UI verification
on:
  push:
    branches: [main]
    paths:
      - 'glass-calendar/**'
      - '.github/workflows/daylight-ui.yml'
  pull_request:
    paths:
      - 'glass-calendar/**'
      - '.github/workflows/daylight-ui.yml'
permissions:
  contents: read
concurrency:
  group: daylight-reference-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference-ui:
    name: Exact HTML layout and working local interactions
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: glass-calendar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check exact HTML entry, standalone style and local-only runtime
        run: |
          test -s index.html
          test -s daylight-preview.css
          test -s daylight-preview.js
          test -s secure-app/src/local-store.js
          ! grep -q 'site-config.js' index.html
          ! grep -q 'secure-app/src/main.js' index.html
          grep -q 'id="sidebar"' index.html
          grep -q 'id="headerBand"' index.html
          grep -q 'id="viewWrap"' index.html
          node --check daylight-preview.js
          node --check secure-app/src/local-store.js
      - name: Test events, calendars, themes and 16 screenshot layouts
        run: CI= npx playwright test tests/reference-ui.spec.js --reporter=line --workers=1
      - name: Preserve screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daylight-reference-html-screenshots
          path: |
            glass-calendar/test-results/**/*.png
            glass-calendar/test-results/**/*.zip
          retention-days: 7
          if-no-files-found: ignore
  deployed-page:
    name: Verify GitHub Pages serves the new reference HTML
    if: github.event_name == 'push'
    needs: reference-ui
    runs-on: ubuntu-latest
    steps:
      - name: Check published new entry
        shell: bash
        run: |
          set -euo pipefail
          url="https://joeynatale28-source.github.io/main-hub/glass-calendar/"
          for attempt in $(seq 1 35); do
            if curl -LfsS --max-time 15 "$url?ref=${{ github.sha }}" -o /tmp/daylight.html &&
               grep -q 'daylight-preview.js' /tmp/daylight.html &&
               curl -LfsS --max-time 15 "${url}daylight-preview.js" | grep -q 'function renderTimeGrid'; then
              echo "Daylight exact-reference UI deployed"
              exit 0
            fi
            sleep 6
          done
          echo "GitHub Pages has not served the new reference UI"
          exit 1
