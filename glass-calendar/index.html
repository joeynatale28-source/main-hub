<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="daylight. — your private calendar and tasks, securely synced to your account.">
  <title>Daylight — Calendar</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./secure-app/src/style.css?v=secure-1101">
  <script>
    try {
      const theme=localStorage.getItem('daylight-theme')||'system';
      document.documentElement.dataset.theme=theme==='system'
        ? (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')
        : theme;
    } catch {}
  </script>
  <script src="./site-config.js?v=secure-1101"></script>
</head>
<body>
  <div id="root"></div>
  <noscript>JavaScript is required to use Daylight.</noscript>
  <script type="module" src="./secure-app/src/main.js?v=secure-1101"></script>
</body>
</html>
