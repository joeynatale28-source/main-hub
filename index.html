<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Joey's Hub</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    color: #f5f5f7; min-height: 100dvh; -webkit-font-smoothing: antialiased;
    background: #0a0505 url('bg.jpg') center / cover no-repeat fixed;
  }
  body::before { content: ""; position: fixed; inset: 0; background: rgba(5,2,2,.35); z-index: -1; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 9vh 24px 60px; }

  /* hero clock */
  .hero { text-align: center; margin-bottom: 34px; }
  .clock { font-size: clamp(84px, 14vw, 150px); font-weight: 700; letter-spacing: -4px; line-height: 1;
    text-shadow: 0 4px 40px rgba(0,0,0,.45); font-variant-numeric: tabular-nums; }
  .dateline { font-size: clamp(17px, 2.6vw, 22px); color: rgba(245,245,247,.75); margin-top: 10px; font-weight: 500; }
  .daypill { display: inline-block; margin-top: 14px; padding: 7px 18px; border-radius: 999px;
    background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
    font-size: 15px; font-weight: 600; color: #ffd9d9; }

  /* glass card base */
  .glass {
    background: rgba(30, 12, 12, 0.42);
    border: 1px solid rgba(255,255,255,.14); border-radius: 24px;
    backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
    box-shadow: 0 12px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
  }

  /* weather */
  .weather { max-width: 560px; margin: 0 auto 26px; padding: 22px 30px;
    display: flex; align-items: center; gap: 22px; }
  .w-icon { font-size: 52px; }
  .w-temp { font-size: 56px; font-weight: 700; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
  .w-cond { font-size: 16px; color: rgba(245,245,247,.7); margin-top: 2px; }
  .w-div { width: 1px; align-self: stretch; background: rgba(255,255,255,.16); }
  .w-loc { font-size: 17px; font-weight: 600; }
  .w-hl { font-size: 15px; color: rgba(245,245,247,.7); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .w-advice { font-size: 14px; color: rgba(245,245,247,.6); margin-top: 4px; }

  /* widget grid */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 860px) { .grid { grid-template-columns: repeat(2, 1fr); } }

  .widget { padding: 20px; min-height: 168px; display: flex; flex-direction: column;
    text-decoration: none; color: inherit; transition: transform .15s ease, background .15s ease; position: relative; }
  a.widget:hover { transform: translateY(-2px); background: rgba(45, 18, 18, 0.5); }
  a.widget:active { transform: scale(.98); }
  .w-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: auto; }
  .app-icon { width: 46px; height: 46px; border-radius: 13px; display: flex; align-items: center; justify-content: center;
    font-size: 24px; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.1); }
  .go { color: rgba(245,245,247,.45); font-size: 18px; }
  .w-title { font-size: 18px; font-weight: 700; margin-top: 14px; }
  .w-sub { font-size: 14px; color: rgba(245,245,247,.62); margin-top: 4px; line-height: 1.45; }
  .w-sub b { color: rgba(245,245,247,.9); font-weight: 600; }

  .updated { text-align: center; font-size: 12px; color: rgba(245,245,247,.45); margin-top: 34px; }
  .err { text-align: center; padding: 40px; color: rgba(245,245,247,.6); }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="clock" id="clock">--:--</div>
    <div class="dateline" id="dateline">—</div>
    <div><span class="daypill" id="daypill">—</span></div>
  </div>

  <div class="glass weather" id="weatherCard" style="display:none">
    <div class="w-icon" id="wIcon">⛅</div>
    <div>
      <div class="w-temp" id="wTemp">—</div>
      <div class="w-cond" id="wCond">—</div>
    </div>
    <div class="w-div"></div>
    <div>
      <div class="w-loc">📍 Richmond</div>
      <div class="w-hl" id="wHL">—</div>
      <div class="w-advice" id="wAdvice">—</div>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="updated" id="updated"></div>
</div>

<script>
/* live clock */
function tick() {
  const n = new Date();
  let h = n.getHours() % 12; if (h === 0) h = 12;
  const m = String(n.getMinutes()).padStart(2, '0');
  document.getElementById('clock').textContent = String(h).padStart(2, '0') + ':' + m;
  document.getElementById('dateline').textContent =
    n.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}
tick(); setInterval(tick, 15000);

function wEmoji(line) {
  line = (line || '').toLowerCase();
  if (line.includes('sun') || line.includes('clear')) return '☀️';
  if (line.includes('cloud')) return '⛅';
  if (line.includes('rain') || line.includes('shower')) return '🌧️';
  if (line.includes('storm')) return '⛈️';
  if (line.includes('fog')) return '🌫️';
  if (line.includes('snow')) return '❄️';
  return '⛅';
}

fetch('data.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(d => {
    document.getElementById('daypill').textContent =
      d.meta.day + (d.meta.day_tag ? ' · ' + d.meta.day_tag : '');

    /* weather */
    document.getElementById('weatherCard').style.display = 'flex';
    document.getElementById('wIcon').textContent = wEmoji(d.weather.line);
    document.getElementById('wTemp').textContent = d.weather.high + '°';
    document.getElementById('wCond').textContent = d.weather.line;
    document.getElementById('wHL').textContent = 'H ' + d.weather.high + '° · L ' + d.weather.low + '°';
    document.getElementById('wAdvice').textContent = d.weather.advice;

    /* widgets */
    const due = d.today.due || [];
    const up = (d.school.upcoming || []);
    const tests = up.filter(i => i.is_test);
    const nextTest = tests[0];
    const swim = d.swim || {};
    const meet = (swim.meets || [])[0];

    const cards = [
      {
        icon: '📚', title: 'School',
        sub: due.length
          ? '<b>' + due[0].title + '</b><br>Due ' + due[0].due + (due.length > 1 ? ' · +' + (due.length - 1) + ' more' : '')
          : 'Nothing due — nice. ✨',
        link: due.length && due[0].link ? due[0].link : 'https://henrico.schoology.com/'
      },
      {
        icon: '🏊', title: 'Swim',
        sub: swim.practice_today
          ? '<b>Practice today</b><br>' + swim.practice_today
          : (meet ? '<b>' + meet.name + '</b><br>' + meet.in_days + ' days · ' + meet.note : 'No practice today'),
        link: null
      },
      {
        icon: '📝', title: 'Up next',
        sub: nextTest
          ? '<b>' + nextTest.title + '</b><br>' + nextTest.course + ' · ' + nextTest.due
          : (up.length ? '<b>' + up[0].title + '</b><br>' + up[0].due : 'Nothing coming up 🎉'),
        link: (nextTest && nextTest.study) ? nextTest.study.url : (up.length && up[0].link ? up[0].link : null)
      },
      {
        icon: '🗓️', title: d.meta.day,
        sub: (d.today.classes || []).slice(0, 4).join(' · ') || 'No classes',
        link: null
      }
    ];

    document.getElementById('grid').innerHTML = cards.map(c => {
      const inner =
        '<div class="w-top"><div class="app-icon">' + c.icon + '</div>' +
        (c.link ? '<div class="go">↗</div>' : '') + '</div>' +
        '<div class="w-title">' + c.title + '</div>' +
        '<div class="w-sub">' + c.sub + '</div>';
      return c.link
        ? '<a class="glass widget" href="' + c.link + '" target="_blank" rel="noopener">' + inner + '</a>'
        : '<div class="glass widget">' + inner + '</div>';
    }).join('');

    document.getElementById('updated').textContent = 'Updated ' + d.meta.generated_label;
  })
  .catch(() => {
    document.getElementById('grid').innerHTML =
      '<div class="err">Couldn\'t load today\'s data.<br>Check back after the morning update.</div>';
  });
</script>
</body>
</html>
